<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATARI SHERWAN - GoldHEN Loader</title>
    <style>
        body {
            background: radial-gradient(circle at center, #0a192f 0%, #050b14 100%);
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 10vh;
            height: 100vh;
            overflow: hidden;
        }
        .box {
            background: rgba(13, 27, 42, 0.85);
            border: 2px solid rgba(0, 255, 204, 0.2);
            display: inline-block;
            padding: 35px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 255, 204, 0.1);
            max-width: 550px;
            width: 85%;
        }
        h1 {
            color: #00ffcc;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
        }
        .welcome-text {
            color: #38bdf8;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .loader {
            border: 5px solid #1e293b;
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #log {
            color: #e2e8f0;
            font-size: 15px;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>ATARI SHERWAN</h1>
        <div class="welcome-text">WELCOME TO MY CENTER SHERWAN</div>
        
        <div class="loader" id="spinner"></div>
        <div id="log">خەریکی ئامادەکردنی فێرژن و بارکردنی GoldHEN...</div>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('log').innerHTML = "<span style='color: #00ffcc;'>کونەکە جێبەجێ کرا! GoldHEN بار دەبێت...</span>";
            setTimeout(function() {
                document.getElementById('log').innerHTML = "<span style='color: #00ffcc;'>GoldHEN بە سەرکەوتوویی کارا بوو! ئامێرەکە ئامادەیە.</span>";
                document.getElementById('spinner').style.display = 'none';
            }, 1500);
        });

        setTimeout(function() {
            try {
                document.getElementById('log').innerText = "پشکنینی سیستەم و بارکردنی پەیلوود...";
                
                history.pushState({}, '', '');
                setTimeout(function() {
                    location.hash = "";
                    document.getElementById('log').innerHTML = "<span style='color: #00ffcc;'>GoldHEN بە سەرکەوتوویی کارا بوو! ئامێرەکە ئامادەیە.</span>";
                    document.getElementById('spinner').style.display = 'none';
                }, 2000);

            } catch(err) {
                document.getElementById('log').innerHTML = "<span style='color: #ff4d4d;'>هەڵە: " + err.message + "</span>";
                document.getElementById('spinner').style.display = 'none';
            }
        }, 1000);
    </script>

</body>
</html>
