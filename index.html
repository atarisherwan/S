<!DOCTYPE html>

            background: #050b14;
            color: #ffffff;

            text-align: center;
            margin: 0;
            padding-top: 20vh;
        }
        h1 {
            color: #00ffcc;

            color: #a0aec0;
            font-size: 18px;

        .loader {
            border: 5px solid #1e293b;
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        setTimeout(function() {
            var ua = navigator.userAgent;
            // نموونەی پشکنینی فێرژن و ڕێڕەوکردن بۆ فۆڵدەرەکان
