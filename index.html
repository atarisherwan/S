<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATARI SHERWAN - PS4 GoldHEN Auto Host</title>
    <style>
        body {
            background: linear-gradient(135deg, #050b14 0%, #0d1b2a 50%, #1b263b 100%);
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(13, 27, 42, 0.75);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #00ffcc;
            margin: 0;
            font-size: 38px;
            letter-spacing: 3px;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        p.subtitle {
            color: #a0aec0;
            font-size: 18px;
            margin-top: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .welcome-text {
            color: #ffffff;
            font-size: 15px;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }
        .status {
            margin-top: 30px;
            font-size: 16px;
            color: #38bdf8;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ATARI SHERWAN</h1>
        <p class="subtitle">Sherwan Center</p>
        <div class="welcome-text">WELCOME TO MY CENTER SHERWAN</div>
        
        <div class="status" id="statusText">چاوەڕوان بە... سیستەم دەناسێتەوە و GoldHEN کار پێدەکات</div>
    </div>

    <div class="footer">
        <p>Atari Sherwan - Soran | Automatic Exploit Host</p>
    </div>

    <script>
        // لێرەدا کۆدی ئۆتۆماتیکی ناسینەوەی فێرژن و کارپێکردنی GoldHEN جێگیر دەبێت
        setTimeout(function() {
            document.getElementById("statusText").innerHTML = "تکایە کەمێک چاوەڕوان بە، هاک دەکرێت...";
        }, 2000);
    </script>

</body>
</html>
